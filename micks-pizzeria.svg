
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MICK'S PIZZERIA</title>
  <desc id="desc">Tarjeta de proyecto con estética gastronómica en rojo y crema.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#251311"/>
      <stop offset="55%" stop-color="#130d0c"/>
      <stop offset="100%" stop-color="#321512"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a72e24"/>
      <stop offset="50%" stop-color="#f05b42"/>
      <stop offset="100%" stop-color="#b73528"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7cda5"/>
      <stop offset="50%" stop-color="#fff0d1"/>
      <stop offset="100%" stop-color="#d9b98d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ef593f" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#ef593f" stop-opacity="0"/>
    </radialGradient>
    <style>
      .cream { fill: url(#cream); }
      .muted { fill: #c5a99a; font-family: Arial, sans-serif; }
      .main { fill: #fff0d1; font-family: Georgia, serif; }
      .small { font: 15px Arial, sans-serif; letter-spacing: 3px; }
      .flicker { animation: flicker 4s ease-in-out infinite; }
      .float { animation: float 5s ease-in-out infinite; transform-origin: 990px 210px; }
      @keyframes flicker {
        0%, 100% { opacity: .4; }
        50% { opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#a84a36" stroke-opacity=".7"/>

  <circle cx="990" cy="210" r="190" fill="url(#glow)" class="float"/>
  <circle cx="990" cy="210" r="132" fill="none" stroke="#e15a42" stroke-opacity=".18"/>
  <circle cx="990" cy="210" r="105" fill="none" stroke="#e15a42" stroke-opacity=".35" stroke-dasharray="4 12"/>

  <path d="M790 0 L1200 0 L1200 420 L1020 420 Z" fill="#e75a42" opacity=".04"/>
  <path d="M52 54 H1148" stroke="#d45a43" stroke-opacity=".4"/>
  <path d="M52 366 H1148" stroke="#d45a43" stroke-opacity=".4"/>

  <text x="70" y="96" fill="#ef8069" class="small">PORTFOLIO PROJECT / 02</text>

  <text x="68" y="190" class="main" font-size="64" letter-spacing="2">MICK'S</text>
  <text x="72" y="240" class="cream" font-family="Georgia, serif" font-size="31" letter-spacing="8">PIZZERIA</text>

  <rect x="72" y="270" width="82" height="3" rx="2" fill="url(#red)" class="flicker"/>

  <text x="72" y="316" class="muted" font-size="19">Sitio web conceptual para una pizzería</text>
  <text x="72" y="344" class="muted" font-size="15">HTML5  /  CSS3  /  JAVASCRIPT</text>

  <g transform="translate(990 210)" class="float">
    <circle r="75" fill="none" stroke="url(#cream)" stroke-width="2"/>
    <circle r="64" fill="none" stroke="#e15a42" stroke-opacity=".55"/>
    <path d="M-43 -35 L48 -5 L-15 52 Z" fill="#e9bd71" stroke="#fff0d1" stroke-width="3"/>
    <path d="M-34 -27 L35 -4 L-12 37 Z" fill="#c64b31"/>
    <circle cx="-13" cy="-12" r="7" fill="#f4d58a"/>
    <circle cx="13" cy="-3" r="7" fill="#f4d58a"/>
    <circle cx="-10" cy="15" r="7" fill="#f4d58a"/>
    <path d="M-43 -35 L48 -5 L-15 52 Z" fill="none" stroke="#f6dca8" stroke-width="2"/>
  </g>

  <text x="1130" y="394" text-anchor="end" fill="#c18a72" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">NICLUCCA · 2026</text>
</svg>
